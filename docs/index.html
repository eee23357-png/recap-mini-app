<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recap Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1f2937;
        --accent: #4f8cff;
        --accent-2: #7ee787;
        --text: #e5edf7;
        --muted: #a8b3c7;
        --danger: #ff6b6b;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      .wrap {
        width: min(100%, 800px);
      }
      .card {
        background: var(--panel);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.24);
      }
      h2 {
        margin-top: 0;
      }
      .preview-box {
        position: relative;
        width: 100%;
        max-width: 420px;
        aspect-ratio: 9 / 16;
        margin: 16px auto;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(135deg, #1c2333, #09111f);
        border: 2px solid rgba(255,255,255,0.08);
      }
      .preview-box video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .selection {
        position: absolute;
        border: 2px solid rgba(255,255,255,0.8);
        background: rgba(79, 140, 255, 0.18);
        box-shadow: inset 0 0 0 9999px rgba(79,140,255,0.08);
        pointer-events: auto;
        cursor: move;
        touch-action: none;
      }
      .resize-handle {
        position: absolute;
        right: -7px;
        bottom: -7px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
        border: 2px solid var(--accent);
        cursor: nwse-resize;
        touch-action: none;
      }
      .subtitle-marker {
        position: absolute;
        border: 2px solid rgba(126,231,135,0.95);
        background: rgba(126,231,135,0.2);
        box-shadow: inset 0 0 0 9999px rgba(126,231,135,0.06);
        cursor: move;
        touch-action: none;
        user-select: none;
      }
      .subtitle-marker::before {
        content: 'Subtitle';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 4px 8px;
        border: 1px solid rgba(126,231,135,0.9);
        border-radius: 8px;
        background: rgba(126,231,135,0.2);
        color: white;
        font-size: 12px;
        white-space: nowrap;
      }
      .controls {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        border: none;
        background: var(--accent);
        border-radius: 10px;
        color: white;
        padding: 12px 16px;
        font-weight: bold;
        cursor: pointer;
      }
      button.secondary {
        background: var(--panel-2);
      }
      button.danger {
        background: var(--danger);
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
      }
      label {
        display: grid;
        grid-template-columns: 110px 1fr 42px;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      input[type="file"] {
        width: 100%;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h2>Recap Mini App</h2>
        <p class="meta">Load the same video here to preview blur, subtitle position, size, and color.</p>

        <input id="video-file" type="file" accept="video/*" />

        <div class="preview-box" id="preview-box">
          <video id="preview-video" controls muted playsinline></video>
          <div class="selection" id="selection-box"></div>
          <div class="subtitle-marker" id="subtitle-marker"></div>
        </div>

        <div class="controls">
          <label>Brightness <input id="brightness" type="range" min="-100" max="100" value="0" /><output id="brightness-value">0</output></label>
          <label>Contrast <input id="contrast" type="range" min="-100" max="100" value="0" /><output id="contrast-value">0</output></label>
          <label>Saturation <input id="saturation" type="range" min="-100" max="100" value="0" /><output id="saturation-value">0</output></label>
          <div class="row">
            <button id="center-blur">Center blur</button>
            <button id="bottom-subtitle" class="secondary">Bottom subtitle</button>
          </div>
          <div class="row">
            <button id="save">Save</button>
            <button id="done">Done</button>
            <button id="reset" class="secondary">Reset</button>
          </div>
          <div class="meta" id="save-status">Not saved yet</div>
        </div>
      </div>
    </div>

    <script>
      const previewBox = document.getElementById('preview-box');
      const selectionBox = document.getElementById('selection-box');
      const subtitleMarker = document.getElementById('subtitle-marker');
      const previewVideo = document.getElementById('preview-video');
      const videoFile = document.getElementById('video-file');
      const saveBtn = document.getElementById('save');
      const doneBtn = document.getElementById('done');
      const saveStatus = document.getElementById('save-status');
      const resetBtn = document.getElementById('reset');
      const centerBlurBtn = document.getElementById('center-blur');
      const bottomSubtitleBtn = document.getElementById('bottom-subtitle');
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'resize-handle';
      selectionBox.appendChild(resizeHandle);
      const subtitleResizeHandle = document.createElement('div');
      subtitleResizeHandle.className = 'resize-handle';
      subtitleMarker.appendChild(subtitleResizeHandle);
      const colorInputs = {
        brightness: document.getElementById('brightness'),
        contrast: document.getElementById('contrast'),
        saturation: document.getElementById('saturation'),
      };

      let box = { x: 0.38, y: 0.42, w: 0.26, h: 0.18 };
      let subtitleBox = { x: 0.25, y: 0.82, w: 0.5, h: 0.08 };
      let dragging = false;
      let dragOffset = { x: 0, y: 0 };
      let resizing = false;

      function renderColor() {
        const brightness = Number(colorInputs.brightness.value);
        const contrast = 100 + Number(colorInputs.contrast.value);
        const saturation = 100 + Number(colorInputs.saturation.value);
        previewVideo.style.filter = `brightness(${100 + brightness}%) contrast(${contrast}%) saturate(${saturation}%)`;
        Object.keys(colorInputs).forEach((name) => {
          document.getElementById(`${name}-value`).value = colorInputs[name].value;
        });
      }

      function renderSelection() {
        const rect = previewBox.getBoundingClientRect();
        const left = box.x * rect.width;
        const top = box.y * rect.height;
        const width = box.w * rect.width;
        const height = box.h * rect.height;
        selectionBox.style.left = `${left}px`;
        selectionBox.style.top = `${top}px`;
        selectionBox.style.width = `${width}px`;
        selectionBox.style.height = `${height}px`;
        subtitleMarker.style.left = `${subtitleBox.x * rect.width}px`;
        subtitleMarker.style.top = `${subtitleBox.y * rect.height}px`;
        subtitleMarker.style.width = `${subtitleBox.w * rect.width}px`;
        subtitleMarker.style.height = `${subtitleBox.h * rect.height}px`;
      }

      function applyCenterBlur() {
        box = { x: 0.38, y: 0.42, w: 0.26, h: 0.18 };
        renderSelection();
      }

      function applyBottomSubtitle() {
        subtitleBox = { x: 0.25, y: 0.85, w: 0.5, h: 0.08 };
        renderSelection();
      }

      function resetPosition() {
        box = { x: 0.38, y: 0.42, w: 0.26, h: 0.18 };
        subtitleBox = { x: 0.25, y: 0.85, w: 0.5, h: 0.08 };
        renderSelection();
      }

      selectionBox.addEventListener('pointerdown', (event) => {
        if (event.target === resizeHandle) return;
        const rect = previewBox.getBoundingClientRect();
        dragging = true;
        dragOffset = {
          x: event.clientX - (rect.left + box.x * rect.width),
          y: event.clientY - (rect.top + box.y * rect.height),
        };
        selectionBox.setPointerCapture(event.pointerId);
      });

      selectionBox.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const rect = previewBox.getBoundingClientRect();
        box.x = Math.max(0, Math.min(1 - box.w, (event.clientX - rect.left - dragOffset.x) / rect.width));
        box.y = Math.max(0, Math.min(1 - box.h, (event.clientY - rect.top - dragOffset.y) / rect.height));
        renderSelection();
      });

      selectionBox.addEventListener('pointerup', () => {
        dragging = false;
      });

      resizeHandle.addEventListener('pointerdown', (event) => {
        event.stopPropagation();
        resizing = true;
        resizeHandle.setPointerCapture(event.pointerId);
      });
      resizeHandle.addEventListener('pointermove', (event) => {
        if (!resizing) return;
        const rect = previewBox.getBoundingClientRect();
        box.w = Math.max(0.08, Math.min(1 - box.x, (event.clientX - rect.left) / rect.width - box.x));
        box.h = Math.max(0.06, Math.min(1 - box.y, (event.clientY - rect.top) / rect.height - box.y));
        renderSelection();
      });
      resizeHandle.addEventListener('pointerup', () => {
        resizing = false;
      });

      let draggingSubtitle = false;
      subtitleMarker.addEventListener('pointerdown', (event) => {
        draggingSubtitle = true;
        const rect = previewBox.getBoundingClientRect();
        subtitleMarker.dataset.offsetX = event.clientX - (rect.left + subtitleBox.x * rect.width);
        subtitleMarker.dataset.offsetY = event.clientY - (rect.top + subtitleBox.y * rect.height);
        subtitleMarker.setPointerCapture(event.pointerId);
      });
      subtitleMarker.addEventListener('pointermove', (event) => {
        if (!draggingSubtitle) return;
        const rect = previewBox.getBoundingClientRect();
        const offsetX = Number(subtitleMarker.dataset.offsetX || 0);
        const offsetY = Number(subtitleMarker.dataset.offsetY || 0);
        subtitleBox.x = Math.max(0, Math.min(1 - subtitleBox.w, (event.clientX - rect.left - offsetX) / rect.width));
        subtitleBox.y = Math.max(0, Math.min(1 - subtitleBox.h, (event.clientY - rect.top - offsetY) / rect.height));
        renderSelection();
      });
      subtitleMarker.addEventListener('pointerup', () => {
        draggingSubtitle = false;
      });

      let resizingSubtitle = false;
      subtitleResizeHandle.addEventListener('pointerdown', (event) => {
        event.stopPropagation();
        resizingSubtitle = true;
        subtitleResizeHandle.setPointerCapture(event.pointerId);
      });
      subtitleResizeHandle.addEventListener('pointermove', (event) => {
        if (!resizingSubtitle) return;
        const rect = previewBox.getBoundingClientRect();
        subtitleBox.w = Math.max(0.2, Math.min(1 - subtitleBox.x, (event.clientX - rect.left) / rect.width - subtitleBox.x));
        subtitleBox.h = Math.max(0.04, Math.min(0.3, (event.clientY - rect.top) / rect.height - subtitleBox.y));
        renderSelection();
      });
      subtitleResizeHandle.addEventListener('pointerup', () => {
        resizingSubtitle = false;
      });

      function buildPayload() {
        return {
          action: 'miniapp_submit',
          blur: box,
          subtitle: {
            x: subtitleBox.x + subtitleBox.w / 2,
            y: subtitleBox.y + subtitleBox.h / 2,
          },
          subtitle_scale: Math.max(0.5, Math.min(2.5, subtitleBox.h / 0.08)),
          color: {
            brightness: Number(colorInputs.brightness.value),
            contrast: Number(colorInputs.contrast.value),
            saturation: Number(colorInputs.saturation.value),
          },
          ts: Date.now(),
        };
      }

      function saveSettings() {
        const payload = buildPayload();
        localStorage.setItem('recap-mini-app-settings', JSON.stringify(payload));
        saveStatus.textContent = 'Saved ✓ You can press Done now.';
        saveStatus.style.color = 'var(--accent-2)';
      }

      centerBlurBtn.addEventListener('click', applyCenterBlur);
      bottomSubtitleBtn.addEventListener('click', applyBottomSubtitle);
      resetBtn.addEventListener('click', resetPosition);
      saveBtn.addEventListener('click', saveSettings);
      Object.values(colorInputs).forEach((input) => input.addEventListener('input', renderColor));
      videoFile.addEventListener('change', () => {
        const file = videoFile.files && videoFile.files[0];
        if (!file) return;
        if (previewVideo.src) URL.revokeObjectURL(previewVideo.src);
        previewVideo.src = URL.createObjectURL(file);
        previewVideo.load();
      });

      window.addEventListener('resize', renderSelection);
      renderSelection();
      renderColor();

      doneBtn.addEventListener('click', () => {
        const payload = buildPayload();
        localStorage.setItem('recap-mini-app-settings', JSON.stringify(payload));

        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.sendData(JSON.stringify(payload));
          tg.close();
          return;
        }

        alert(JSON.stringify(payload, null, 2));
      });
    </script>
  </body>
</html>
