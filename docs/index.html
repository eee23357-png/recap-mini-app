<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recap Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1f2937;
        --accent: #4f8cff;
        --accent-2: #7ee787;
        --text: #e5edf7;
        --muted: #a8b3c7;
        --danger: #ff6b6b;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      .wrap {
        width: min(100%, 800px);
      }
      .card {
        background: var(--panel);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.24);
      }
      h2 {
        margin-top: 0;
      }
      .preview-box {
        position: relative;
        width: 100%;
        max-width: 420px;
        aspect-ratio: 9 / 16;
        margin: 16px auto;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(135deg, #1c2333, #09111f);
        border: 2px solid rgba(255,255,255,0.08);
      }
      .preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .selection {
        position: absolute;
        border: 2px solid rgba(255,255,255,0.8);
        background: rgba(79, 140, 255, 0.18);
        box-shadow: inset 0 0 0 9999px rgba(79,140,255,0.08);
        pointer-events: auto;
        cursor: move;
        touch-action: none;
      }
      .subtitle-marker {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 6px 10px;
        border: 1px solid rgba(126,231,135,0.9);
        border-radius: 8px;
        background: rgba(126,231,135,0.2);
        color: white;
        font-size: 12px;
        cursor: move;
        touch-action: none;
        user-select: none;
      }
      .controls {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        border: none;
        background: var(--accent);
        border-radius: 10px;
        color: white;
        padding: 12px 16px;
        font-weight: bold;
        cursor: pointer;
      }
      button.secondary {
        background: var(--panel-2);
      }
      button.danger {
        background: var(--danger);
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h2>Recap Mini App</h2>
        <p class="meta">Choose blur box and subtitle position directly on the preview.</p>

        <div class="preview-box" id="preview-box">
          <img id="preview-image" src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=900&q=80" alt="preview" />
          <div class="selection" id="selection-box"></div>
          <div class="subtitle-marker" id="subtitle-marker">Subtitle</div>
        </div>

        <div class="controls">
          <div class="row">
            <button id="center-blur">Center blur</button>
            <button id="bottom-subtitle" class="secondary">Bottom subtitle</button>
          </div>
          <div class="row">
            <button id="submit">Submit</button>
            <button id="reset" class="secondary">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const previewBox = document.getElementById('preview-box');
      const selectionBox = document.getElementById('selection-box');
      const subtitleMarker = document.getElementById('subtitle-marker');
      const previewImage = document.getElementById('preview-image');
      const submitBtn = document.getElementById('submit');
      const resetBtn = document.getElementById('reset');
      const centerBlurBtn = document.getElementById('center-blur');
      const bottomSubtitleBtn = document.getElementById('bottom-subtitle');

      let box = { x: 0.38, y: 0.42, w: 0.26, h: 0.18 };
      let subtitle = { x: 0.5, y: 0.88 };
      let dragging = false;
      let dragOffset = { x: 0, y: 0 };

      function renderSelection() {
        const rect = previewBox.getBoundingClientRect();
        const left = box.x * rect.width;
        const top = box.y * rect.height;
        const width = box.w * rect.width;
        const height = box.h * rect.height;
        selectionBox.style.left = `${left}px`;
        selectionBox.style.top = `${top}px`;
        selectionBox.style.width = `${width}px`;
        selectionBox.style.height = `${height}px`;
        subtitleMarker.style.left = `${subtitle.x * rect.width}px`;
        subtitleMarker.style.top = `${subtitle.y * rect.height}px`;
      }

      function applyCenterBlur() {
        box = { x: 0.38, y: 0.42, w: 0.26, h: 0.18 };
        renderSelection();
      }

      function applyBottomSubtitle() {
        subtitle = { x: 0.5, y: 0.85 };
      }

      function resetPosition() {
        box = { x: 0.38, y: 0.42, w: 0.26, h: 0.18 };
        subtitle = { x: 0.5, y: 0.85 };
        renderSelection();
      }

      selectionBox.addEventListener('pointerdown', (event) => {
        const rect = previewBox.getBoundingClientRect();
        dragging = true;
        dragOffset = {
          x: event.clientX - (rect.left + box.x * rect.width),
          y: event.clientY - (rect.top + box.y * rect.height),
        };
        selectionBox.setPointerCapture(event.pointerId);
      });

      selectionBox.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const rect = previewBox.getBoundingClientRect();
        box.x = Math.max(0, Math.min(1 - box.w, (event.clientX - rect.left - dragOffset.x) / rect.width));
        box.y = Math.max(0, Math.min(1 - box.h, (event.clientY - rect.top - dragOffset.y) / rect.height));
        renderSelection();
      });

      selectionBox.addEventListener('pointerup', () => {
        dragging = false;
      });

      let draggingSubtitle = false;
      subtitleMarker.addEventListener('pointerdown', (event) => {
        draggingSubtitle = true;
        subtitleMarker.setPointerCapture(event.pointerId);
      });
      subtitleMarker.addEventListener('pointermove', (event) => {
        if (!draggingSubtitle) return;
        const rect = previewBox.getBoundingClientRect();
        subtitle.x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        subtitle.y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
        renderSelection();
      });
      subtitleMarker.addEventListener('pointerup', () => {
        draggingSubtitle = false;
      });

      centerBlurBtn.addEventListener('click', applyCenterBlur);
      bottomSubtitleBtn.addEventListener('click', applyBottomSubtitle);
      resetBtn.addEventListener('click', resetPosition);

      window.addEventListener('resize', renderSelection);
      renderSelection();

      submitBtn.addEventListener('click', () => {
        const payload = {
          action: 'miniapp_submit',
          blur: box,
          subtitle: subtitle,
          ts: Date.now(),
        };

        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.sendData(JSON.stringify(payload));
          tg.close();
          return;
        }

        alert(JSON.stringify(payload, null, 2));
      });
    </script>
  </body>
</html>
